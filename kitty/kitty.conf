# Fuente Nerd Font (para iconos: waybar, lazyvim, etc)
font_family      MesloLGS NF
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size 12.0

# Transparencia
background_opacity 0.85
dynamic_background_opacity yes

# Cursor: forma, parpadeo y animacion de trail
cursor_shape beam
cursor_blink_interval 0.5
cursor_stop_blinking_after 0

# Trail animado (cola que sigue al cursor al moverse) - kitty >= 0.30
cursor_trail 1
cursor_trail_decay 0.1 0.4
cursor_trail_start_threshold 2

# Optimizaciones para Neovim (de GentlemanKitty, sin lo especifico de macOS)
term xterm-kitty
undercurl_style thin-sparse
scrollback_lines 10000
repaint_delay 10
input_delay 3
sync_to_monitor yes
enable_audio_bell no

# Control remoto (integracion con plugins de nvim, ej smear.lua) - autorizado explicito
allow_remote_control yes
listen_on unix:/tmp/kitty
