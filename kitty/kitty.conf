# Nerd Font (icons for waybar, lazyvim, etc.)
font_family      MesloLGS NF
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size 12.0

# Transparency
background_opacity 0.85
dynamic_background_opacity yes

# Cursor: shape, blink and trail animation
cursor_shape beam
cursor_blink_interval 0.5
cursor_stop_blinking_after 0

# Animated trail that follows the cursor as it moves; kitty >= 0.30
cursor_trail 1
cursor_trail_decay 0.1 0.4
cursor_trail_start_threshold 2

# Neovim tuning (from GentlemanKitty, minus the macOS-only bits)
term xterm-kitty
undercurl_style thin-sparse
scrollback_lines 10000
repaint_delay 10
input_delay 3
sync_to_monitor yes
enable_audio_bell no

# Remote control for nvim plugins (e.g. smear.lua); explicitly allowed
allow_remote_control yes
listen_on unix:/tmp/kitty
